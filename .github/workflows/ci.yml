name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go install github.com/atombender/go-jsonschema@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: make check
